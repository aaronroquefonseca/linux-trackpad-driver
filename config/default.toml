# Default configuration for linux-trackpad-driver (v1 sectioned schema).
#
# Device tiers: L0 basic no-pressure (pointer speed + finger-count remapping);
# L1 pressure no host buzz (+click/force/slide); L2 pressure+host buzz all
# active (Apple proprietary today, ChromeOS standard planned). Only Apple
# Magic Trackpad 2 implemented; others planned.
# [device] stands alone (independent of enhanced_clicks); [pointer]/[click]/
# [haptics]/[force]/[slide]/[spoof] require enhanced_clicks=true (unsupported
# stay saved+inactive). Omitted keys fall back to defaults. Device-specific
# pressure values, not portable. Unknown keys error.
# Apply: sudo systemctl restart linux-trackpad-driver (required for now; live
# reload planned).
schema_version = 1
log_level = "info"
enhanced_clicks = true

# Apple USB only. Requested Hz 16..110, default 110 (capped device maximum,
# ~110 Hz, 99 F2 X with X = 0x23 = 35, 3850/35 ~= 110; higher unverified).
[device]
polling_rate = 110

[pointer]
# Pointer speed percent, 1..1000, default 100 = 1:1.
speed = 100

[click]
# Press threshold 1..255, default 30 (firmer alt 64). Lower = more sensitive.
sensitivity = 30
# Release hysteresis 0..255, default 5 (release at sensitivity - margin).
margin = 5
click_1 = "left"
click_2 = "right"
click_3 = "middle"
click_4 = "none"
click_5 = "none"
# Per-binding timing opt-in (same keys, different timing):
# click_4 = { action = "super+right", stagger_ms = 0 }

[haptics]
# Strength 0..255 (0 = silent), default 2.
haptic = 2
quiet_click = true
# force_haptic omitted = inherit haptic.
force_quiet_click = false

[force]
# Offset 0..255 (0 disables), default 0. Example owner tune 130 with
# sensitivity 30 fires at 160.
force_offset = 0
force_1 = "none"
force_2 = "none"
force_3 = "none"
force_4 = "none"
force_5 = "none"
# cut (default) releases click keys first; continuous joins force keys.
transition_mode = "cut"
# Fallback gap 0..500 ms, default 50.
combo_stagger_ms = 50
# Per-binding timing opt-in:
# force_1 = { action = "super+left", stagger_ms = 50 }

[slide]
slide_1 = "none"
slide_2 = "none"
slide_3 = "none"
slide_4 = "none"
slide_5 = "none"
# Five-finger drag opt-in:
# slide_5 = { action = "super+left", stagger_ms = 50 }

# TOML-safe: parent first, then sparse subtables. Omitted = real count,
# 0 = passthrough, 1..5 = virtual. Wire always virtual; false = real-count
# actions (recommended), true = virtual (advanced).
[spoof]
actions_follow_spoof = false
# [spoof.slide]
# 5 = 1
# [spoof.click]
# 2 = 3
# [spoof.force]
# 1 = 1
