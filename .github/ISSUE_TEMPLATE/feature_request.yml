name: Feature request
description: Propose a capability, device, or packaging improvement.
title: "[feat]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Mention capability tier (L0/L1a/L1b/L2s/L2p) for device support.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - core-init (USB/BT bring-up, reconnect, suspend)
        - click proxy / haptics
        - config schema
        - packaging (deb/rpm/aur, udev, systemd)
        - docs / CI
        - new device support
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I am willing to test this on my hardware if needed.
          required: false
