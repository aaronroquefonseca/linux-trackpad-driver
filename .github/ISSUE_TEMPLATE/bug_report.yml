name: Bug report
description: Report a problem with device init, reconnect, clicks, or packaging.
title: "[bug]: "
labels: [bug]
body:
  - type: input
    id: ltd-version
    attributes:
      label: "ltd version"
      description: Output of `ltd --version` (or commit SHA if built from source).
      placeholder: "ltd 0.1.0"
    validations:
      required: true
  - type: input
    id: vid-pid
    attributes:
      label: Device VID:PID and connection
      description: e.g. `05ac:0265` over USB, or `004c:0324` over Bluetooth.
      placeholder: "05ac:0265 over USB"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      description: e.g. Ubuntu 24.04, Fedora 41, Arch.
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`.
      placeholder: "6.8.0-52-generic"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands starting from a known state.
      placeholder: |
        1. sudo ltd run
        2. suspend, resume
        3. cursor frozen
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `RUST_LOG` is ignored; the daemon reads `log_level` from the selected config
        (`-c <file>` wins, else `$LTD_CONFIG`, else built-in defaults; the service sets
        `LTD_CONFIG=/etc/linux-trackpad-driver/config.toml`). Set `log_level = "debug"`
        in the file you actually run, then restart the service or start explicitly with
        that file (`sudo ltd run -c <file>`). Include `ltd --version`, `ltd doctor`
        (same file), and the debug excerpt. A listed socket alone does not prove the
        proxy attached. Redact hostnames if you wish.
      render: shell
      placeholder: |
        log_level = "debug" in <selected file>; then:
        START=$(date '+%Y-%m-%d %H:%M:%S')
        sudo systemctl restart linux-trackpad-driver.service
        # ... reproduce the issue, then export the bounded session:
        journalctl -u linux-trackpad-driver.service --since "$START" > /tmp/ltd-run.log
        grep -E 'starting|config:|found|evdev:|actuator|USB init|BT ' /tmp/ltd-run.log | head -30
        grep -E 'resume|proxy|polling|verify|failed|error' /tmp/ltd-run.log | tail -50
        # or: sudo ltd run -c /etc/linux-trackpad-driver/config.toml 2>&1 | tee /tmp/ltd-run.log
        ltd --version
        ltd doctor  # or: ltd doctor -c <same file>
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Contents of your `config.toml` if non-default (or "default"). Also state which file was actually selected (`-c <file>`, `$LTD_CONFIG`, or defaults/service file).
      render: toml
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I included full logs, not just the last line.
          required: true
