name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install packaging tools
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts lintian
      - name: maintainer script syntax + exec bits
        run: |
          test -x debian/rules
          test -x debian/postinst
          test -x debian/prerm
          sh -n debian/postinst
          sh -n debian/prerm
      - name: install manifest targets exist
        run: |
          while read -r src _; do
            case "$src" in ''|\#*) continue;; esac
            case "$src" in target/*) continue;; esac
            test -e "$src" || { echo "missing install source: $src"; exit 1; }
          done < debian/linux-trackpad-driver.install
      - name: staging layout (dh_install fixture)
        run: |
          set -euo pipefail
          # dh_install treats the .install destination as a directory, so the
          # config file must be installed via debian/rules, never via .install.
          if grep -Ev '^[[:space:]]*(#|$)' debian/linux-trackpad-driver.install | grep -q 'etc/linux-trackpad-driver/config.toml'; then
            echo 'config must be installed via debian/rules, not .install file-to-file rename' >&2
            exit 1
          fi
          grep -q 'install -Dm644 config/default.toml debian/linux-trackpad-driver/etc/linux-trackpad-driver/config.toml' debian/rules
          STAGE=$(mktemp -d)
          trap 'rm -rf "$STAGE"' EXIT
          mkdir -p "$STAGE/fixture"
          cp -a debian config udev systemd "$STAGE/fixture/"
          mkdir -p "$STAGE/fixture/target/release"
          printf '#!/bin/sh\nexit 0\n' > "$STAGE/fixture/target/release/ltd"
          chmod +x "$STAGE/fixture/target/release/ltd"
          cd "$STAGE/fixture"
          dh_install
          install -Dm644 config/default.toml debian/linux-trackpad-driver/etc/linux-trackpad-driver/config.toml
          PKG=debian/linux-trackpad-driver
          test -f "$PKG/etc/linux-trackpad-driver/config.toml"
          test ! -e "$PKG/etc/linux-trackpad-driver/config.toml/default.toml"
          test ! -d "$PKG/etc/linux-trackpad-driver/config.toml"
          cmp config/default.toml "$PKG/etc/linux-trackpad-driver/config.toml"
          test "$(stat -c %a "$PKG/etc/linux-trackpad-driver/config.toml")" = 644
          test -f "$PKG/lib/systemd/system/linux-trackpad-driver.service"
          test -f "$PKG/lib/systemd/system/linux-trackpad-driver-reconnect@.service"
          test -f "$PKG/lib/systemd/system/linux-trackpad-driver-resume.service"
          test -f "$PKG/lib/systemd/system-sleep/ltd-resume"
          test -f "$PKG/lib/udev/rules.d/99-linux-trackpad-driver.rules"
          test -f "$PKG/usr/bin/ltd"
      - name: changelog + control syntax
        run: |
          dpkg-parsechangelog -l debian/changelog
          dpkg-checkbuilddeps -d 2>&1 || true
      - name: source package build
        run: dpkg-buildpackage -S -us -uc -d
      - name: lintian (advisory)
        run: lintian --tag-display-limit 0 ../*.dsc || echo "::warning ::lintian reported tags"
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: dnf install -y rpm-build systemd-rpm-macros cargo rustc gcc
      - name: Validate Fedora packaging
        run: |
          set -euo pipefail
          bash -n packaging/fedora/check-fedora.sh
          ./packaging/fedora/check-fedora.sh
      - name: Build binary RPM and inspect payload
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^Version:[[:space:]]*//p' packaging/fedora/linux-trackpad-driver.spec | head -n 1)"
          TOP="$(mktemp -d)"
          trap 'rm -rf "$TOP"' EXIT
          mkdir -p "$TOP/SOURCES"
          tar --mtime='@0' --exclude='./target' --exclude='./.git' \
            --transform "s,^\\./,linux-trackpad-driver-${VERSION}/," \
            -cf - . | gzip -n > "$TOP/SOURCES/linux-trackpad-driver-${VERSION}.tar.gz"
          rpmbuild -bb --define "_topdir $TOP" --define "_sourcedir $TOP/SOURCES" packaging/fedora/linux-trackpad-driver.spec
          # rpmbuild may also generate -debuginfo and -debugsource RPMs.
          # Validate the installable package, never an arbitrary first match.
          RPM="$(find "$TOP/RPMS" -type f -name "linux-trackpad-driver-${VERSION}-*.x86_64.rpm" -print -quit)"
          test -n "$RPM"
          rpm -qpl "$RPM" | grep -Fxq '/usr/bin/ltd'
          rpm -qpl "$RPM" | grep -Fxq '/etc/linux-trackpad-driver/config.toml'
          rpm -qp --scripts "$RPM"
          rpm -qpl "$RPM"
  release-scripts:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: install build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - name: script syntax + offline publishing guards
        run: |
          set -euo pipefail
          bash -n packaging/release/check-version-sync.sh
          bash -n packaging/release/check-release-json.sh
          bash -n packaging/release/verify-assets.sh
          bash -n packaging/release/publish-aur.sh
          bash -n packaging/release/test-release-scripts.sh
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd \"$GITHUB_WORKSPACE\" && packaging/release/test-release-scripts.sh"
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install build tools
        run: pacman -Syu --noconfirm --needed base-devel rust git
      - name: packaging validation (templates, renderer, offline build)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd \"$GITHUB_WORKSPACE\" && packaging/arch/check-aur.sh"
