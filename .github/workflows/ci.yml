name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install packaging tools
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts lintian
      - name: maintainer script syntax + exec bits
        run: |
          test -x debian/rules
          test -x debian/postinst
          test -x debian/prerm
          sh -n debian/postinst
          sh -n debian/prerm
      - name: install manifest targets exist
        run: |
          while read -r src _; do
            case "$src" in ''|\#*) continue;; esac
            case "$src" in target/*) continue;; esac
            test -e "$src" || { echo "missing install source: $src"; exit 1; }
          done < debian/linux-trackpad-driver.install
      - name: changelog + control syntax
        run: |
          dpkg-parsechangelog -l debian/changelog
          dpkg-checkbuilddeps -d 2>&1 || true
      - name: source package build
        run: dpkg-buildpackage -S -us -uc -d
      - name: lintian (advisory)
        run: lintian --tag-display-limit 0 ../*.dsc || echo "::warning ::lintian reported tags"
  release-scripts:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: install build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - name: script syntax + offline publishing guards
        run: |
          set -euo pipefail
          bash -n packaging/release/check-version-sync.sh
          bash -n packaging/release/check-release-json.sh
          bash -n packaging/release/verify-assets.sh
          bash -n packaging/release/publish-aur.sh
          bash -n packaging/release/test-release-scripts.sh
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd \"$GITHUB_WORKSPACE\" && packaging/release/test-release-scripts.sh"
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install build tools
        run: pacman -Syu --noconfirm --needed base-devel rust git
      - name: packaging validation (templates, renderer, offline build)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd \"$GITHUB_WORKSPACE\" && packaging/arch/check-aur.sh"
