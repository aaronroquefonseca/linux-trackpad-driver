name: AUR stable (source + bin)

# Publishes ONLY linux-trackpad-driver (source build) and
# linux-trackpad-driver-bin (prebuilt) from a PUBLIC, final GitHub release.
# Drafts never trigger this: GITHUB_TOKEN-created drafts do not emit release
# events, so the intended chain is
#   release-tag.yml builds + opens a draft ->
#   maintainer reviews and clicks Publish (web UI or own token) ->
#   release.published fires -> this workflow verifies + renders + pushes.
# A trusted manual retry (workflow_dispatch with publish=true) re-verifies
# that the release is already public before pushing anything.
#
# Activation: repo variable ENABLE_AUR_STABLE=true plus secret
# AUR_SSH_PRIVATE_KEY (SSH key registered with the AUR account). Without both,
# runs stop after verify/render (workflow artifacts only).
# The first authenticated push creates the AUR package — no manual repo
# bootstrap needed. Both packages share the same AUR account/key.
#
# Safety: no force-push (ever), no silent downgrades (a stale release event
# older than the AUR master fails closed), idempotent noops, partial-success
# retries safe, unrelated AUR files preserved. Serialized via concurrency.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string
      publish:
        description: "Push to AUR (else dry-run: verify + render only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-stable
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      commit: ${{ steps.gate.outputs.commit }}
      bin-x86: ${{ steps.gate.outputs.bin-x86 }}
      bin-aarch64: ${{ steps.gate.outputs.bin-aarch64 }}
      source-sha: ${{ steps.gate.outputs.source-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$EVENT_TAG"
          else
            raw_tag="$INPUT_TAG"
          fi
          [[ "$raw_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::bad tag '$raw_tag' (want vX.Y.Z)"; exit 1; }
          version="${raw_tag#v}"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          # Public + final, or stop before any download: drafts and
          # prereleases never reach AUR stable.
          gh release view "$raw_tag" --repo "$GH_REPO" \
            --json tagName,isDraft,isPrerelease > "$work/release.json"
          ./packaging/release/check-release-json.sh "$raw_tag" "$work/release.json"
          mkdir -p "$work/assets"
          gh release download "$raw_tag" --repo "$GH_REPO" --dir "$work/assets" \
            --pattern 'SHA256SUMS' \
            --pattern 'linux-trackpad-driver-v*.tar.gz'
          out="$(./packaging/release/verify-assets.sh "$version" "$work/assets")"
          bin_x86="$(printf '%s\n' "$out" | sed -n 's/^BIN_X86_64_SHA=//p')"
          bin_arm="$(printf '%s\n' "$out" | sed -n 's/^BIN_AARCH64_SHA=//p')"
          [[ "$bin_x86" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad x86_64 digest"; exit 1; }
          [[ "$bin_arm" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad aarch64 digest"; exit 1; }
          # Stable source is the GitHub tag archive (no upload needed). Its
          # bytes only exist after the tag push, so digest it here.
          curl --fail --show-error --location --retry 3 --retry-all-errors \
            -o "$work/source.tar.gz" \
            "https://github.com/${GH_REPO}/archive/refs/tags/${raw_tag}.tar.gz"
          source_sha="$(sha256sum -- "$work/source.tar.gz" | awk '{print $1}')"
          [[ "$source_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad source digest"; exit 1; }
          # Tag commit must match: the archive has to be exactly what the
          # release points at, and the tag must still point there (tags that
          # moved since the release build fail closed).
          api_commit="$(gh api "repos/${GH_REPO}/commits/${raw_tag}" --jq .sha)"
          [[ "$api_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad tag commit"; exit 1; }
          ls_remote="$(git ls-remote "https://github.com/${GH_REPO}.git" "refs/tags/${raw_tag}^{}" "refs/tags/${raw_tag}")"
          peeled="$(printf '%s\n' "$ls_remote" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          tag_commit="${peeled:-$(printf '%s\n' "$ls_remote" | awk '$2 !~ /\^\{\}$/ {print $1}' | head -n 1)}"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve tag $raw_tag"; exit 1; }
          [ "$tag_commit" = "$api_commit" ] \
            || { echo "::error::tag $raw_tag moved (upstream $tag_commit != release $api_commit)"; exit 1; }
          # Source tree must carry the release version (ties tag commit to
          # tarball bytes beyond the renderer layout check).
          mkdir -p "$work/src"
          tar -xzf "$work/source.tar.gz" -C "$work/src"
          src_cargo="$work/src/linux-trackpad-driver-${version}/Cargo.toml"
          [ -f "$src_cargo" ] || { echo "::error::source archive lacks Cargo.toml"; exit 1; }
          src_ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$src_cargo" | head -n 1)"
          [ "$src_ver" = "$version" ] \
            || { echo "::error::source Cargo.toml $src_ver != tag $version"; exit 1; }
          {
            echo "tag=$raw_tag"
            echo "version=$version"
            echo "commit=$api_commit"
            echo "bin-x86=$bin_x86"
            echo "bin-aarch64=$bin_arm"
            echo "source-sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          echo "verify: $raw_tag public+final, assets + source bound to $api_commit"
          mkdir -p aur-input
          cp "$work/assets"/linux-trackpad-driver-*.tar.gz "$work/source.tar.gz" aur-input/
          cp "$work/assets/SHA256SUMS" aur-input/
          printf '%s' "$version" > aur-input/VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur-stable-input
          path: aur-input/
          if-no-files-found: error
          retention-days: 7

  render:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aur-stable-input
          path: aur-input
      - name: install Arch toolchain (real makepkg metadata)
        run: pacman -Syu --noconfirm --needed base-devel git
      - name: render + validate as unprivileged user
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BIN_X86: ${{ needs.verify.outputs.bin-x86 }}
          BIN_ARM: ${{ needs.verify.outputs.bin-aarch64 }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: |
          set -euo pipefail
          for digest in "$BIN_X86" "$BIN_ARM" "$SOURCE_SHA"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad digest from verify"; exit 1; }
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "${RUNNER_TEMP:-/tmp}"
          # shellcheck disable=SC2016 # $0..$4 expand in the su'd shell, not here.
          su builder -s /bin/bash -c 'cd "$0" && packaging/arch/render-aur.sh \
            --version "$1" \
            --source-sha256 "$2" \
            --bin-x86_64-sha256 "$3" \
            --bin-aarch64-sha256 "$4" \
            --out aur-out \
            --source-tarball aur-input/source.tar.gz \
            --bin-x86_64-tarball aur-input/linux-trackpad-driver-v"$1"-x86_64-unknown-linux-gnu.tar.gz \
            --bin-aarch64-tarball aur-input/linux-trackpad-driver-v"$1"-aarch64-unknown-linux-gnu.tar.gz' \
            "$GITHUB_WORKSPACE" "$VERSION" "$SOURCE_SHA" "$BIN_X86" "$BIN_ARM"
          echo "rendered:"
          find aur-out -maxdepth 2 | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur-rendered
          path: aur-out/
          if-no-files-found: error
          retention-days: 7

  push:
    needs: [verify, render]
    # Explicit arming: needs the repo variable AND a trusted publish signal
    # (release.published event, or a manual dispatch with publish=true that
    # re-verified the release is already public). Everything else stops at
    # verify/render artifacts.
    if: >-
      vars.ENABLE_AUR_STABLE == 'true' &&
      (github.event_name == 'release' ||
       inputs.publish == true) &&
      needs.verify.outputs.tag != ''
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aur-rendered
          path: aur-rendered
      - name: install git (push needs a clone, never the checkout tree)
        run: pacman -Syu --noconfirm --needed git
      - name: push source + bin repos (master, append-only)
        env:
          AUR_KNOWN_HOSTS: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          set -euo pipefail
          [ -n "${AUR_SSH_PRIVATE_KEY:-}" ] \
            || { echo "::error::AUR_SSH_PRIVATE_KEY secret is unset"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          msg="AUR stable $VERSION (release $TAG, $COMMIT)"
          ./packaging/release/publish-aur.sh --pkg linux-trackpad-driver \
            --dir aur-rendered/linux-trackpad-driver --message "$msg" \
            --expect-pkgver "$VERSION"
          ./packaging/release/publish-aur.sh --pkg linux-trackpad-driver-bin \
            --dir aur-rendered/linux-trackpad-driver-bin --message "$msg" \
            --expect-pkgver "$VERSION"
