name: AUR git snapshot

# Publishes ONLY linux-trackpad-driver-git (VCS snapshot of main) after
# trusted packaging-relevant main changes, or after an explicit manual retry
# targeting main. Never bumps versions per driver commit: pkgver() computes
# at install time, and the static pkgver line is refreshed at release-prep
# time only.
#
# Activation: repo variable ENABLE_AUR_GIT=true plus secret
# AUR_SSH_PRIVATE_KEY (same AUR-registered key as stable). Without both, runs
# are dry-runs: metadata is generated and uploaded as a workflow artifact,
# nothing is pushed.
#
# The first authenticated push creates the AUR package — no manual repo
# bootstrap needed. No source/bin publication happens here, ever.

on:
  push:
    branches: [main]
    paths:
      - "packaging/arch/**"
      - "packaging/release/publish-aur.sh"
      - "systemd/**"
      - "udev/**"
      - "config/default.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/aur-git.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push snapshot to AUR (else dry-run: validate only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-git
  cancel-in-progress: false

jobs:
  snapshot:
    # Execution trust before checkout: the helper below runs from the
    # checkout, so a branch-owned replacement must never execute, let alone
    # authorize the push. Both main pushes and main manual retries pass.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Exact main-event revision (push tip or main dispatch tip).
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SNAPSHOT: ${{ github.sha }}
          AUR_GIT_VAR: ${{ vars.ENABLE_AUR_GIT }}
        run: |
          set -euo pipefail
          # Trusted-ref boundary (tested in gate-aur-git.sh): dispatches
          # against any ref but main are denied here, before any packaging
          # output is generated or published.
          out="$(./packaging/release/gate-aur-git.sh)"
          short="$(printf '%s\n' "$out" | sed -n 's/^short=//p')"
          snapshot="$(printf '%s\n' "$out" | sed -n 's/^snapshot=//p')"
          publish="$(printf '%s\n' "$out" | sed -n 's/^publish=//p')"
          [[ "$snapshot" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad snapshot"; exit 1; }
          [ "$publish" = "true" ] || [ "$publish" = "false" ] \
            || { echo "::error::bad publish decision"; exit 1; }
          {
            echo "short=$short"
            echo "snapshot=$snapshot"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: install Arch toolchain (real makepkg metadata)
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh
          command -v git
          command -v ssh
          command -v makepkg
      - name: generate -git metadata as unprivileged user
        env:
          SHORT: ${{ steps.gate.outputs.short }}
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "${RUNNER_TEMP:-/tmp}"
          # shellcheck disable=SC2016 # $0 expands in the su'd shell, not here.
          su builder -s /bin/bash -c 'cd "$0" && rm -rf git-out && mkdir -p git-out && \
            cp packaging/arch/PKGBUILD-git git-out/PKGBUILD && \
            cp packaging/arch/ltd.install git-out/ltd.install && \
            ( cd git-out && makepkg --printsrcinfo > .SRCINFO ) && \
            cat git-out/.SRCINFO' "$GITHUB_WORKSPACE"
          printf '%s' "$SHORT" > git-out/SNAPSHOT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur-git-rendered
          path: git-out/
          # .SRCINFO is hidden; the downloadable evidence must carry it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: push -git repo (master, append-only)
        # Credentialed step: independently re-enforces main ref, toggle, and
        # the trusted publish signal. A replaced branch helper can neither
        # execute (job skipped off-main) nor self-authorize here.
        if: >-
          steps.gate.outputs.publish == 'true' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_AUR_GIT == 'true' &&
          (github.event_name == 'push' || inputs.publish == true)
        env:
          # Secret is scoped to this gated step only: metadata generation
          # above never sees publication credentials.
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          SHORT: ${{ steps.gate.outputs.short }}
          SNAPSHOT: ${{ steps.gate.outputs.snapshot }}
          AUR_KNOWN_HOSTS: aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
        run: |
          set -euo pipefail
          [ -n "${AUR_SSH_PRIVATE_KEY:-}" ] \
            || { echo "::error::AUR_SSH_PRIVATE_KEY secret is unset"; exit 1; }
          command -v ssh >/dev/null \
            || { echo "::error::ssh client not found (install openssh)"; exit 1; }
          ./packaging/release/publish-aur.sh --pkg linux-trackpad-driver-git \
            --dir git-out --message "git snapshot $SHORT (main $SNAPSHOT)"
