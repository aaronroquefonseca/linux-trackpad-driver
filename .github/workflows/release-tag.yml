name: Release (tag)

# Tag `vX.Y.Z` -> build matrix (x86_64 + aarch64) -> x86_64 .deb (debian/) +
# per-arch binary tarballs (binary + systemd units + udev rules + default
# config + licenses) + full-history git-cliff CHANGELOG excerpt + SHA256SUMS
# -> draft GitHub Release. A human publishes the draft; the stable AUR
# pipeline (aur-stable.yml) only runs after that manual publish step.
#
# Activation: set repo variable ENABLE_RELEASE_PUBLISH=true (Settings >
# Variables). Without it, tag pushes and dispatches only build and upload
# workflow *artifacts* — no Release object is created or touched.
# Secret inventory: none. This workflow uses only GITHUB_TOKEN.
#
# Retry: re-running a tag build never mutates a PUBLISHED release. If the
# release already left draft state the draft step fails closed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0 (never builds main)"
        required: true
        type: string
      publish:
        description: "Create/refresh the draft GitHub Release (else build-only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      commit: ${{ steps.gate.outputs.commit }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Dispatch rebuilds the exact tag tree, never the branch it runs on.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_PUBLISH_VAR: ${{ vars.ENABLE_RELEASE_PUBLISH }}
        run: |
          set -euo pipefail
          raw_tag="${INPUT_TAG:-$REF_NAME}"
          raw_tag="${raw_tag#refs/tags/}"
          [[ "$raw_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::bad tag '$raw_tag' (want vX.Y.Z)"; exit 1; }
          git rev-parse -q --verify "refs/tags/$raw_tag" >/dev/null \
            || { echo "::error::tag '$raw_tag' does not exist upstream"; exit 1; }
          commit="$(git rev-parse "$raw_tag^{commit}")"
          # Trust only tags pointing into main history; PR trees never qualify
          # (this workflow has no pull_request trigger by design).
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "::error::tag '$raw_tag' ($commit) is not reachable from origin/main"; exit 1; }
          # Signed-tag SOP (docs/RELEASING.md): tags must be annotated. A
          # verifiable signature is warned on, not hard-required, so the flow
          # stays usable before the maintainer's signing key is configured —
          # the draft is human-gated before anything goes public.
          if [ "$(git cat-file -t "$raw_tag")" != "tag" ]; then
            echo "::error::tag '$raw_tag' is lightweight; create an annotated tag (git tag -s/-a), never re-tag a release"
            exit 1
          fi
          if ! git tag -v "$raw_tag" >/dev/null 2>&1; then
            echo "::warning::tag '$raw_tag' has no verifiable GPG signature (SOP wants git tag -s)"
          fi
          version="${raw_tag#v}"
          ./packaging/release/check-version-sync.sh "$version"
          want="false"
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            want="true"
          fi
          publish="false"
          if [ "$want" = "true" ] && [ "$RELEASE_PUBLISH_VAR" = "true" ]; then
            publish="true"
          fi
          {
            echo "tag=$raw_tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "preflight: tag=$raw_tag commit=$commit publish=$publish (want=$want, toggle=${RELEASE_PUBLISH_VAR:-unset})"

  build:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb: true
          - target: aarch64-unknown-linux-gnu
            deb: false
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Exact tagged commit resolved once in preflight: a dispatch tag
          # must not silently build whatever main points at.
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: deb packaging tools
        if: matrix.deb
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: stage dist tarball
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ltd"
          stage="dist-stage/linux-trackpad-driver-${TAG}-${{ matrix.target }}"
          mkdir -p "$stage"/{config,udev,systemd/system-sleep}
          cp "$bin" "$stage/ltd"
          cp config/default.toml "$stage/config/"
          cp udev/99-linux-trackpad-driver.rules "$stage/udev/"
          cp systemd/*.service "$stage/systemd/"
          cp systemd/system-sleep/ltd-resume "$stage/systemd/system-sleep/"
          cp README.md INSTALL.md LICENSE-MIT LICENSE-APACHE "$stage/"
          mkdir -p dist
          tar -C dist-stage -czf \
            "dist/linux-trackpad-driver-${TAG}-${{ matrix.target }}.tar.gz" \
            "linux-trackpad-driver-${TAG}-${{ matrix.target }}"
      - name: build .deb (x86_64, from debian/)
        if: matrix.deb
        run: |
          # Release .deb reuses the in-tree debian/ packaging as-is.
          # Cargo/debian version sync is verified in preflight (fail-closed).
          dpkg-buildpackage -b -us -uc -d
          mv ../*.deb dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: CHANGELOG excerpt (git-cliff, full history)
        # Release notes style: git-cliff excerpt from Conventional Commits
        # (cliff.toml). This differs from MyWhisper's PR-linked notes
        # generator — that repo has no cliff.toml; both produce coherent
        # per-release notes, the mechanism is not claimed identical.
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --tag ${{ env.TAG }} --strip all --output dist/CHANGELOG-${{ env.TAG }}.md
      - name: SHA256SUMS (explicit assets, never self)
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- \
            "linux-trackpad-driver-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "linux-trackpad-driver-${TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            ./*.deb \
            "CHANGELOG-${TAG}.md" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [preflight, assemble]
    # Explicit gate: draft Release objects are only created when armed (see
    # header). Build-only runs stop at workflow artifacts.
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-release
          path: dist
      - name: create/refresh draft GitHub Release (never public)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(
            "dist/linux-trackpad-driver-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/linux-trackpad-driver-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
            "dist/CHANGELOG-${TAG}.md"
            dist/*.deb
            dist/SHA256SUMS
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::missing release file: $f"; exit 1; }
          done
          notes="dist/CHANGELOG-${TAG}.md"
          if gh release view "$TAG" --json tagName,isDraft,isPrerelease \
              > release-state.json 2>/dev/null; then
            draft="$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')"
            prerelease="$(python3 -c 'import json; print(json.load(open("release-state.json"))["isPrerelease"])')"
            if [ "$prerelease" = "True" ]; then
              echo "::error::release $TAG is marked prerelease; stable pipeline ships finals only"
              exit 1
            fi
            if [ "$draft" != "True" ]; then
              # Rerun guard: a published release is immutable to automation.
              # Refreshing it would silently rewrite public assets.
              echo "::error::release $TAG is already published; refusing to mutate public assets (cut a new patch release instead)"
              exit 1
            fi
            echo "refreshing existing draft release $TAG"
            gh release upload "$TAG" --clobber "${files[@]}"
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            echo "creating draft release $TAG at $COMMIT"
            gh release create "$TAG" "${files[@]}" \
              --target "$COMMIT" \
              --title "$TAG" --notes-file "$notes" \
              --draft
          fi
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$is_draft" = "true" ] \
            || { echo "::error::release $TAG did not stay a draft"; exit 1; }
          echo "draft release $TAG ready for human review; nothing published"
