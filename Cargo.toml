[package]
name = "linux-trackpad-driver"
version = "0.1.3"
edition = "2021"
description = "Linux driver core-init for Apple Magic Trackpad 2 (USB/BT)"
authors = ["Aarón Roque Fonseca <aaronroquefonseca@gmail.com>"]
homepage = "https://github.com/aaronroquefonseca/linux-trackpad-driver"
repository = "https://github.com/aaronroquefonseca/linux-trackpad-driver"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["trackpad", "hid", "hidraw", "driver", "apple"]
categories = ["hardware-support", "command-line-utilities"]

[[bin]]
name = "ltd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
